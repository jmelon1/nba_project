models:
  - name: stg_coach_info
    description: Cleaned coaching records including wins, losses, and playoff results per season
    columns:
      - name: coach_id
        description: Unique identifier for each coach
        data_tests:
          - not_null
      - name: team_id
        description: Foreign key to stg_reg_seaon
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_reg_season')
                field: team_id
      - name: season_year
        data_tests:
          - not_null

  - name: stg_reg_season
    description: Season level team performance including offensive and defensive stats
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: season_year
        data_tests:
          - not_null
      - name: conference_id
        data_tests:
          - accepted_values:
              arguments:
                values: ['E', 'W']

  - name: stg_playoffs
    description: Series level playoff results including winner, loser, and round
    columns:
      - name: winner_team_id
        data_tests:
          - not_null
      - name: loser_team_id
        data_tests:
          - not_null
      - name: playoff_round
        data_tests:
          - accepted_values:
              arguments:
                values: ['CFR', 'CSF', 'CF', 'F', 'SF', 'QF', 'DF', 'DSF', 'DT']

  - name: stg_bios
    description: Player biographical information including name, position, and birth details
    columns:
      - name: bio_id
        description: Primary key for player bios
        data_tests:
          - unique
          - not_null

  - name: stg_player_awards
    description: Individual player award records
    columns:
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bios')
                field: bio_id

  - name: stg_allstars
    description: Player all star game appearance and performance records
    columns:
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bios')
                field: bio_id

  - name: stg_drafts
    description: NBA draft picks including round, overall pick, and college or country of origin
    columns:
      - name: draft_overall_pick
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null

  - name: stg_hof
    description: Hall of fame inductees filtered to players and coaches
    columns:
      - name: hof_id
        data_tests:
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ['Player', 'Coach']