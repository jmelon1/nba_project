models:
  - name: fct_coach_performance
    description: Career aggregated coaching metrics including wins, playoff appearances, and weighted coach score
    columns:
      - name: coach_id
        description: Primary key, unique identifier for each coach
        data_tests:
          - unique
          - not_null
      - name: coach_name
        description: Full names of coaches derived from stg_bios via player ID match. Falls back to coach_id for coaches with no playing career on record
      - name: career_win_pct
        description: Career wins divided by career games coached, rounded to 3 decimal places
      - name: playoff_appearance_rate
        description: Proportion of seasons coached where team made the playoffs
      - name: coach_score
        description: Weighted career achievement score, see methodology section in README

  - name: fct_player_accolades
    description: Career aggregated player accolades including awards, all star appearances, and HOF status
    columns:
      - name: player_id
        description: Foreign key to stg_bios, not enforced as unique due to source data duplicates
        data_tests:
          - not_null
      - name: draft_pick_score
        description: Weighted career achievement score, see methodology section in README
      - name: inducted_to_hof
        description: HOF status derived from name join, see known limitations in README

  - name: fct_draft_performance
    description: Draft pick level performance including weighted draft score and class aggregations
    columns:
      - name: player_id
        description: Foreign key to stg_bios
        data_tests:
          - not_null
          - unique
      - name: draft_overall_pick
        description: Overall selection number across all rounds, used as primary draft ranking variable
        data_tests:
          - not_null
      - name: draft_pick_score
        description: Weighted career achievement score combining awards, all-star appearances, and HOF status
      - name: avg_class_score
        description: Average draft pick score across all players in the same draft year
      - name: total_class_score
        description: Sum of all draft pick scores for players in the same draft year
      - name: notable_players_at_pick
        description: Top 3 players selected at given overall pick number

  - name: fct_playoff_trends
    description: Team level playoff performance per season including deepest round, championship, and regular season context
    columns:
      - name: team_id
        description: Foreign key to stg_reg_season
        data_tests:
          - not_null
      - name: season_year
        description: NBA season year
        data_tests:
          - not_null
      - name: deepest_round_order
        description: Numeric representation of deepest playoff round reached
      - name: decade
        description: Decade bucket for trend analysis, derived from season_year
      - name: won_championship
        description: True if team won the Finals series in that season